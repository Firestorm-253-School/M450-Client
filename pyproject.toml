[project]
name = "snake_game_client"
version = "0.1.0"
description = "Snake Game Client"
requires-python = ">=3.11"

dependencies = [
    "pygame",
    "websockets"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100