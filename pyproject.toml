[project]
name = "snake_game_client"
version = "0.1.0"
description = "Snake Game Client"
requires-python = ">=3.12,<3.14"

dependencies = [
    "pygame",
    "websockets",
    "pyperclip"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "ruff"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.coverage.run]
source = ["snake_game_client"]
branch = true